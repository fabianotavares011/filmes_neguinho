<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastrar.css">
    <title>Cadastrar Filme</title>

   
</head>
<body>
    <header>
        <a href="../index.html">Voltar</a>
        <h1>Cadastrar novos filmes</h1>
    </header>

    <main>
        <form>
            <div>
                <label for="name">Título do filme:</label>
                <input type="text" id="name" placeholder="Digite aqui o título">
            </div>
            <div>
                <label for="gender">Gênero:</label>
                <input type="text" id="gender" placeholder="Digite aqui o gênero">
            </div>
            <div>
                <label for="classification">Classificação indicativa:</label>
                <input type="number" id="classification" placeholder="Digite aqui a classificação indicativa">
            </div>
            <div>
                <label for="duration">Duração:</label>
                <input type="number" id="duration" placeholder="Digite aqui a duração">
            </div>

            
        </form>
        <button class="botao" onclick="cadastrarFilme()">Cadastrar</button>
        
    </main>

    <script src="./cadastrar.js"></script>


</body>
</html>
